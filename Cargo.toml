[package]
name = "rrkernel"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Mohamed A.Taha <ahmed.boin@gmail.com>"]
description = "Preemptive round-robin RTOS kernel: one API for bare-metal Cortex-M (SysTick+PendSV, cycle-exact slices) and std desktops, with an optional #[rrkernel] attribute that makes main() task 0."
license = "MIT"
readme = "README.md"
keywords = ["rtos", "no_std", "embedded", "cortex-m", "scheduler"]
categories = ["embedded", "no-std", "concurrency"]

[lib]
name = "rrkernel"
path = "src/lib.rs"

# --- Workspace -------------------------------------------------------------
# `firmware-cortex-m` is a separate bare-metal binary (own linker script, own
# target), so it is a member but *not* a default member: a plain `cargo build`
# at the root only builds the portable kernel library.
[workspace]
members = [
    "firmware-cortex-m",
    "firmware-riscv",
    "firmware-arm-a",
    "firmware-esp32",
    "firmware-common",
    "examples/cortex-m-bluepill",
    "examples/cortex-m-blackpill",
    "rrkernel-macros",
]
default-members = ["."]

# --- Feature flags ---------------------------------------------------------
# default  : `no_std` bare metal. Zero dependencies. The active backend is
#            picked from the target triple (arch::mod), not from a feature,
#            so `--target thumbv7m-none-eabi` "just works".
# `std`    : desktop backend (Windows / Linux / macOS). Still ZERO external
#            dependencies: the few OS primitives we need are declared by hand
#            in `arch::host::ffi`.
[features]
default = ["macros"]
std = []
# `#[rrkernel]` and the runtime pieces it uses. This pulls in `syn`/`quote`, which are
# *host-only, build-time* dependencies: nothing extra reaches the target image, and
# `default-features = false` leaves the kernel exactly as dependency-free as before.
macros = ["dep:rrkernel-macros"]
# `block_on`, the task `Waker`, `async fn sleep`, `spawn_async`. Pulls in **nothing**: it is
# `core::future` on top of the event layer that is already in the kernel. The feature exists so the
# default build stays as small as it is.
async = []
# `embedded-hal` adapters: delays, the blocking facade over an async driver, and a kernel-mutex
# device for a shared bus.
hal = ["dep:embedded-hal"]
# `embedded-hal-async` adapters. Implies nothing on its own; `async` is separate so a blocking-only
# application does not pay for the executor.
hal-async = ["dep:embedded-hal-async"]
# `embedded-io` byte streams on top of an ISR-driven `Signal` (blocking reads/writes).
io = ["dep:embedded-io"]
# `embedded-io-async` byte streams over the same `Signal`. Needs `async` for `block_on` and `io`
# for the shared `ErrorType` impl.
io-async = ["dep:embedded-io-async", "io", "async"]

[dependencies]
# See `macros` above. The proc-macro crate only ever runs in the compiler.
rrkernel-macros = { path = "rrkernel-macros", optional = true }

# --- Opt-in HAL/IO adapters ------------------------------------------------
# The kernel itself is `core`-only and dependency-free (see the features above). These four are
# what Phase 5 needs to expose the standard embedded traits, and they are pulled in **only** when
# the corresponding feature is on, so `cargo build --target thumbv7m-none-eabi` still links
# nothing but `core`.
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

# --- Profiles --------------------------------------------------------------
# Timing-oriented release profile. NOTE: deliberately no `panic = "abort"` in
# dev/test — that would break `cargo test` (the test harness needs unwinding).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true          # keeps objdump output readable; drop for final size

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1

# --- Host-side demos -------------------------------------------------------
[[example]]
name = "roundrobin_demo"
path = "examples/roundrobin_demo.rs"
required-features = ["std"]

[[example]]
name = "jitter_bench"
path = "examples/jitter_bench.rs"
required-features = ["std"]

[[example]]
name = "smoke"
path = "examples/smoke.rs"
required-features = ["std"]

[[example]]
name = "sleep_fidelity"
path = "examples/sleep_fidelity.rs"
required-features = ["std"]

[[example]]
name = "io_layers"
path = "examples/io_layers.rs"
required-features = ["std", "async", "hal", "hal-async", "io"]
